map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ─── Port 80 HTTP (ACME Challenge + Frontend Proxy) ──────────────────────────

# Hagatna Customer (hagatnaa.com & www.hagatnaa.com)
server {
    listen 80;
    server_name hagatnaa.com www.hagatnaa.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Hagatna Admin (admin.hagatnaa.com)
server {
    listen 80;
    server_name admin.hagatnaa.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

